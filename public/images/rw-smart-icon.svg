<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="rwSmartGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#147A45"/>
      <stop offset="100%" stop-color="#0D5737"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#C6952B"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0D5737" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#rwSmartGrad)" filter="url(#softShadow)"/>
  
  <!-- Subtle inner outline -->
  <rect x="3" y="3" width="42" height="42" rx="11" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

