  <rect x="16" y="29" width="4" height="7" rx="1" fill="#147A45"/>

  <!-- Center Main Home (Harmony & Leadership) -->
  <path d="M22 24L31 16L40 24V36H22V24Z" fill="#FFFFFF"/>
  <path d="M31 14L19.5 24L21.5 26L31 17.5L40.5 26L42.5 24L31 14Z" fill="url(#goldAccent)"/>
