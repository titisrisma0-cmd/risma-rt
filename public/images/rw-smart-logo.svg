<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="220" height="50" fill="none">
  <defs>
    <linearGradient id="logoIconGrad" x1="2" y1="2" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#147A45"/>
      <stop offset="100%" stop-color="#0D5737"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#C6952B"/>
    </linearGradient>
  </defs>

  <!-- Icon (44x44) -->
  <g transform="translate(3, 3)">
    <rect width="44" height="44" rx="12" fill="url(#logoIconGrad)"/>
    <rect x="1" y="1" width="42" height="42" rx="11" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    
    <!-- Smaller home -->
    <path d="M12 28L19 22L26 28V36H12V28Z" fill="#FFFFFF" fill-opacity="0.88"/>
    <path d="M19 20L10.5 27.5L12 29L19 23L26 29L27.5 27.5L19 20Z" fill="url(#logoGold)"/>
    <rect x="16" y="29" width="4" height="7" rx="1" fill="#147A45"/>

    <!-- Main home -->
    <path d="M22 24L31 16L40 24V36H22V24Z" fill="#FFFFFF"/>
    <path d="M31 14L19.5 24L21.5 26L31 17.5L40.5 26L42.5 24L31 14Z" fill="url(#logoGold)"/>
    <rect x="28" y="26" width="6" height="10" rx="1.5" fill="#0D5737"/>
    <circle cx="31" cy="21" r="1.5" fill="url(#logoGold)"/>

    <!-- Arc -->
    <path d="M10 39C16 41.5 32 41.5 38 39" stroke="#E5C158" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(56, 12)">
    <!-- RW SMART Main Text -->
    <text x="0" y="20" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5" fill="#17221C">
      RW <tspan fill="#147A45">SMART</tspan>
    </text>
    <!-- Tagline / Subtitle -->
    <text x="1" y="32" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="8" font-weight="600" letter-spacing="1.2" fill="#758078" text-transform="uppercase">
      Sistem Rukun Warga
    </text>
  </g>
</svg>
